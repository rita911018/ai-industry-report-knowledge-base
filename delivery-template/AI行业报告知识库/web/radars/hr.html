      <h1>人力资源 AI 机会雷达</h1>
      <h2>核心判断</h2><p>优先增强员工服务、技能流动与学习闭环；越接近个人生计的决定，越不能把责任交给模型。</p>
      <h2>12 个场景</h2><ol><li>HR 政策问答、统一入口与服务分流</li><li>技能画像、岗位技能图谱与内部人才匹配</li><li>个性化学习、岗位辅导与 AI 素养提升</li><li>入转调离、证明与 HR 文档自动化</li><li>招聘需求、职位描述、寻源与面试辅助</li><li>战略人力规划、岗位拆解与容量模拟</li><li>管理者 Copilot、团队设计与变革采用</li><li>员工倾听、主题归纳与敬业度诊断</li><li>绩效反馈、职业路径与发展建议</li><li>流失风险、组织健康与人才供需分析</li><li>员工行为、情绪与生产率监测</li><li>AI 自主录用、晋升、调薪或解雇</li></ol>
      <h2>90 天试点</h2><p>政策问答与服务分流；岗位技能图谱与内部匹配；个性化学习与 AI 工作辅导。</p>
      <h2>治理门槛</h2><p>目的限制与数据最小化；不利影响测试；具名人员决定与申诉；政策版本回链；最小权限与审计；中英双语回归测试。</p>
      <h2>来源</h2><p>BCG、Anthropic、McKinsey、MIT Sloan 与 Bain 的十篇本地归档研究和官网原文。</p>
