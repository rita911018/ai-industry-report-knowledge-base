      <h1>人力资源 AI 机会雷达</h1>
      <h2>核心判断</h2><p>优先增强员工服务、技能流动与学习闭环；越接近个人生计的决定，越不能把责任交给模型。</p>
      <h2>AI 能解决哪些业务问题</h2><ol><li>用 AI 即时回答 HR 政策问题，并把复杂个案转给对的人</li><li>用 AI 看清员工技能，并匹配内部岗位和项目</li><li>用 AI 为不同岗位定制学习路径和工作辅导</li><li>用 AI 自动准备入职、调岗、离职和证明文件</li><li>用 AI 起草职位、寻找候选人并辅助结构化面试</li><li>用 AI 拆解岗位任务，预测人力和技能缺口</li><li>用 AI 帮助经理重组团队工作并推动员工采用</li><li>用 AI 读懂员工反馈，找出敬业度和体验问题</li><li>用 AI 整理绩效证据并给出职业发展选项</li><li>用 AI 预警团队流失和关键人才短缺</li><li>用 AI 监测员工行为与情绪（高风险，默认不做）</li><li>让 AI 决定录用、晋升、调薪或解雇（禁止）</li></ol>
      <h2>建议优先启动的 3 个场景</h2><p>HR 政策问答与分流；岗位技能图谱与内部匹配；岗位化学习与 AI 辅导。</p>
