      <h1>企业法务 AI 机会雷达</h1>
      <h2>核心判断</h2><p>最佳切入点不是“替代律师”，而是把可验证、可逆、高频的工作先做成 AI 增强流程。</p>
      <h2>12 个场景</h2><ol><li>标准合同审查、生成与红线比对</li><li>法务统一入口、自动分流与知识问答</li><li>存量合同搜索、条款抽取与履约预警</li><li>法律检索、法规问答与文书初稿</li><li>隐私权请求、数据映射与合规工作流</li><li>外部律师账单审核与律所选择</li><li>诉讼取证、内部调查与批量文档审阅</li><li>法规变化监测、适用性判断与控制映射</li><li>并购尽调与交易文件分析</li><li>知识产权组合、申请与期限管理</li><li>诉讼策略、结果预测与谈判辅助</li><li>AI 自主谈判、接受条款或签署</li></ol>
      <h2>90 天试点</h2><p>标准合同审查与业务自助；法务问答与统一入口；存量合同风险盘点。</p>
      <h2>治理门槛</h2><p>训练与保存边界；最小权限与审计；中国法源与跨境验证；回答有据；具名律师审批；中英双语回归测试。</p>
      <h2>来源</h2><p>Luminance、Icertis、Ironclad、Josef、Thomson Reuters、Relativity、OneTrust、Brightflag、PERSUIT、Anaqua、Harvey、阿里云、Microsoft、BCG 与 Litera 的公开材料。</p>
