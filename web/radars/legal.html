      <h1>企业法务 AI 机会雷达</h1>
      <h2>核心判断</h2><p>最佳切入点不是“替代律师”，而是把可验证、可逆、高频的工作先做成 AI 增强流程。</p>
      <h2>AI 能解决哪些业务问题</h2><ol><li>用 AI 审查标准合同、生成条款并标出偏离</li><li>用 AI 回答法务常见问题并自动分流复杂请求</li><li>用 AI 盘点存量合同并提醒续约与履约风险</li><li>用 AI 查法规和案例并起草法律文件初稿</li><li>用 AI 处理隐私请求并维护数据合规记录</li><li>用 AI 审核外部律师账单并辅助选择律所</li><li>用 AI 从海量材料中找出诉讼和调查关键证据</li><li>用 AI 追踪法规变化并映射到内部控制</li><li>用 AI 审阅并购材料并快速发现交易风险</li><li>用 AI 管理专利商标组合、申请材料和期限</li><li>用 AI 辅助诉讼策略和谈判，但不替律师判断</li><li>让 AI 自主谈判或签合同（禁止）</li></ol>
      <h2>建议优先启动的 3 个场景</h2><p>标准合同首审；法务问答与分流；存量合同风险盘点。</p>
